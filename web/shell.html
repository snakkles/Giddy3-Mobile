<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Giddy 3</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; overflow: hidden;
    font-family: system-ui, sans-serif; touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; overscroll-behavior: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas.game { display: block; background: #000; image-rendering: pixelated;
    width: min(100vw, calc(100vh * 4 / 3)) !important; height: min(100vh, calc(100vw * 3 / 4)) !important; outline: none; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; background: #000; text-align: center; padding: 16px; }
  #overlay img { width: 72px; height: 72px; image-rendering: pixelated; }
  #play { font-size: 20px; padding: 14px 34px; border-radius: 10px; border: 0; background: #e8c547; color: #000; font-weight: 600; }
  #play:disabled { opacity: .5; }
  #status { font-size: 14px; opacity: .8; min-height: 1.2em; }
  #hint { font-size: 13px; opacity: .6; max-width: 26em; }
  #rotate { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); align-items: center;
    justify-content: center; font-size: 18px; text-align: center; padding: 16px; pointer-events: none; }
  @media (orientation: portrait) { body.playing #rotate { display: flex; } }
</style>
</head>
<body>
<div id="wrap"><canvas class="game" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas></div>
<div id="overlay">
  <img src="icon.png" alt="">
  <div style="font-size:24px;font-weight:600">Giddy 3</div>
  <button id="play" disabled>Loading…</button>
  <div id="status"></div>
  <div id="hint">Hold your phone sideways. Left thumb: joystick (bottom left). Right thumb: jump / use / hint buttons. Double-tap the middle of the screen to pause.</div>
</div>
<div id="rotate">Rotate your phone to landscape ↻</div>
<script>
  var statusEl = document.getElementById('status');
  var playBtn = document.getElementById('play');
  var Module = {
    canvas: document.getElementById('canvas'),
    noInitialRun: true,
    preRun: [function () {
      FS.mkdir('/save');
      FS.mount(IDBFS, {}, '/save');
      addRunDependency('idbfs');
      FS.syncfs(true, function () {
        try { FS.mkdir('/save/hats'); } catch (e) {}
        removeRunDependency('idbfs');
      });
    }],
    onRuntimeInitialized: function () {
      playBtn.disabled = false;
      playBtn.textContent = 'Tap to play';
      statusEl.textContent = '';
    },
    syncSaves: function () { FS.syncfs(false, function () {}); },
    setStatus: function (t) { if (t) statusEl.textContent = t.replace(/\(.*\)/, ''); },
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); }
  };
  window.onerror = function (m) { statusEl.textContent = 'Error: ' + m; };

  playBtn.addEventListener('click', function () {
    var el = document.documentElement;
    try {
      var p = el.requestFullscreen ? el.requestFullscreen() : (el.webkitRequestFullscreen && el.webkitRequestFullscreen());
      if (p && p.then) p.then(function () {
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
      }).catch(function () {});
    } catch (e) {}
    document.getElementById('overlay').style.display = 'none';
    document.body.classList.add('playing');
    Module.callMain([]);
  });

  function saveNow() { try { if (Module._web_on_hide) Module._web_on_hide(); } catch (e) {} }
  document.addEventListener('visibilitychange', function () { if (document.hidden) saveNow(); });
  window.addEventListener('pagehide', saveNow);
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
</script>
{{{ SCRIPT }}}
</body>
</html>
